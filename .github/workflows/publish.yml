name: Publish schema and vocabularies

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      BASE_URL: https://eomapcompany.github.io/stac-extension-eomap
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
      - run: uv sync --frozen
      - run: uv run pytest
      - name: Tag must match the schema version
        run: |
          expected="$BASE_URL/$TAG/schema.json"
          actual=$(jq -r '."$id"' json-schema/schema.json)
          [ "$actual" = "$expected" ] || { echo "Tag $TAG does not match \$id $actual"; exit 1; }
      - name: Published versions are immutable
        run: |
          if curl -sfI "$BASE_URL/$TAG/schema.json" > /dev/null; then
            echo "$TAG is already published"; exit 1
          fi
      - name: Collect files for the release
        run: |
          mkdir -p public/vocabulary
          cp json-schema/schema.json public/
          cp vocabulary/*.json public/vocabulary/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          destination_dir: ${{ github.event.release.tag_name }}
          keep_files: true
